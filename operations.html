<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Operations workspace</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf5f6;color:#153748;font:15px/1.6 Arial,sans-serif}header,main{max-width:1240px;margin:auto;padding:24px}header{background:#123948;color:white;max-width:none}header .meta{color:#c7e3e5;margin:4px 0}header p{margin:6px 0}header>div{max-width:1192px;margin:auto}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:36px;margin:0}h2{margin-top:0}button,input,select,textarea{font:inherit;border:1px solid #91acb7;border-radius:5px;padding:9px;background:white;color:#123948}button,a{cursor:pointer}button.active,button.primary{background:#087c80;color:white}a{color:#006c74}header a{color:#d0eff0}.view-mobile{display:none}.tabs,.filters,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.panel{background:white;border:1px solid #cedfe3;border-radius:8px;padding:22px;margin:16px 0;min-width:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.two{grid-template-columns:1fr 1fr}.stat{font-size:30px;color:#08777d}.muted{color:#4e6874;font-size:13px}.badge{display:inline-block;border-radius:4px;padding:3px 8px;background:#e5f2f1;font-size:12px}.warn{background:#fff4d6;border-left:4px solid #a76610;padding:12px}.task{border-top:1px solid #dce5e8;padding:16px 0}.task:first-child{border:0}label{display:flex;flex-direction:column;gap:4px}textarea{min-height:90px;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eef5f6;padding:14px;font-size:12px}details{margin:12px 0}summary{cursor:pointer;font-weight:bold}.service-page{break-after:page;min-height:380px;border-top:4px solid #08777d;padding-top:18px}.error{color:#9e3025}.hidden{display:none!important}#content:focus{outline:2px solid #08777d}#status{min-height:26px}.check{padding:12px;border-left:3px solid #08777d;background:#edf6f5;margin:10px 0}h3{margin-bottom:5px}.meta{font-size:12px;overflow-wrap:anywhere}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #d5e4e8;vertical-align:top}td{overflow-wrap:anywhere}.scroll{overflow:auto}@media(max-width:650px){.tabs{display:none}.view-mobile{display:flex}header h1{font-size:27px!important}header,main{padding:16px}.grid,.two{grid-template-columns:1fr}h1{font-size:29px}.panel{padding:16px}.filters>*{width:100%}button{min-height:44px}.tabs{gap:6px}.tabs button{flex:1 1 40%}}@media print{@page{size:A4;margin:16mm}body[data-operations-view="service"] .panel>:not(.service-page),body[data-operations-view="service"] #content>.warn{display:none!important}.ui-shell,.ui-end,.tabs,.filters,button,#status,header{display:none!important}.panel{border:0;margin:0}.service-page{min-height:230mm}main{padding:0}.service-page:last-child{break-after:auto}}
</style></head><body><header><div><p class="meta">LOCAL PLANNING / SOURCE RECORDS STAY IN THEIR WORKSPACES</p><h1>Make the next step clear.</h1><p>One work list, account context and service hand-offs. Research is not a qualified pipeline.</p></div></header><main><div class="tabs" role="group" aria-label="Operations views"><button data-view="work">Work list</button><button data-view="account">Account workspace</button><button data-view="qualification">Evidence gaps</button><button data-view="network">Hospital readiness</button><button data-view="service">Service journey</button><button data-view="history">Saved reviews</button><button data-view="guide">How to use</button></div><label class="view-mobile">Operations view<select id="viewSelect"><option value="work">Work list</option><option value="account">Account workspace</option><option value="qualification">Evidence gaps</option><option value="network">Hospital readiness</option><option value="service">Service journey</option><option value="history">Saved reviews</option><option value="guide">How to use</option></select></label><div id="status" role="status" aria-live="polite">Reading local records…</div><div id="content" tabindex="-1"></div></main><script>
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let state=null,version=0;const params=new URLSearchParams(location.search);let view=params.get('view')||'work',company=params.get('company')||'',filters={space:'research',module:'',owner:'',timing:'',q:''};const el=s=>document.querySelector(s);let requestVersion=0;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Local request failed');return d}
function go(v,c=company){if(window.FormSafety?.hasUnsaved()&&!confirm('Discard unsaved planning changes?'))return;document.querySelectorAll('form').forEach(f=>window.FormSafety?.saved(f));view=v;company=c;history.replaceState(null,'','/operations?'+new URLSearchParams({view,company}));draw()}
function accountLink(name){const a=state?.accounts.find(a=>a.company===name||a.radar===name);return a?'/operations?'+new URLSearchParams({view:'account',company:a.company}):''}
function select(label,id,values,current){return '<label>'+E(label)+'<select id="'+id+'">'+values.map(v=>'<option value="'+E(v[0])+'" '+(v[0]===current?'selected':'')+'>'+E(v[1])+'</option>').join('')+'</select></label>'}
function task(t){return '<article class="task"><span class="badge">'+E(t.space==='simulation'?'FICTIONAL SIMULATION':t.module)+'</span><h3>'+E(t.task)+'</h3><p>'+E(t.company)+' · '+E(t.owner||'Owner not set')+'</p><p class="muted">'+E(t.due_date||'No task date in source')+' · '+E(t.status)+' · Priority '+E(t.priority)+' · Effort '+E(t.effort)+(t.blocked?' · Blocked: '+E(t.planning_blocker||'source hold'):'')+'</p><a href="'+E(t.href)+'">Open source task →</a> '+(accountLink(t.company)?'<a href="'+E(accountLink(t.company))+'">Account context</a>':'<span class="muted">Site task, not a sponsor account</span>')+'<details><summary>Task identity and completion limits</summary><p class="meta">'+E(t.id)+' · source version '+t.version+'</p><p>'+E(t.completion)+'</p></details></article>'}
function selector(){if(!company)company=state.accounts[0]?.company||'';const found=state.accounts.some(a=>a.company===company||a.radar===company);if(found)company=state.accounts.find(a=>a.company===company||a.radar===company).company;return (!found?'<p class="warn">Requested account is unavailable. Choose an exact known account; no substitute was selected.</p>':'')+select('Choose account','accountSelect',[...(!found?[[company,'Requested account unavailable']]:[]),...state.accounts.map(a=>[a.company,a.company])],company)}
function current(){return state.accounts.find(a=>a.company===company)}
function draw(){if(!state)return;document.body.dataset.operationsView=view;el('#viewSelect').value=view;el('#viewSelect').onchange=e=>go(e.target.value);document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let s='';
if(view==='work'){const visible=state.tasks.filter(t=>t.space===filters.space&&(!filters.module||t.module===filters.module)&&(!filters.owner||!t.owner)&&(!filters.timing||(filters.timing==='blocked'?t.blocked:t.timing===filters.timing))&&JSON.stringify([t.company,t.owner,t.task]).toLowerCase().includes(filters.q.toLowerCase()));s='<section class="grid"><div class="panel"><div class="stat">'+visible.length+'</div>tasks in this view</div><div class="panel"><div class="stat">'+state.empty_records.filter(r=>r.space===filters.space).length+'</div>source records without a task, not a task backlog</div><div class="panel"><b>Source-owned tasks</b><p>No automatic merging, completion or staff assignment. Each task has a stable module identity.</p></div></section><section class="panel"><h2>Work list</h2><div class="filters">'+select('Space','space',[['research','Public research'],['simulation','Fictional simulation']],filters.space)+select('Module','module',[['','All modules'],...['Research','CRM','Committee','Hospitals'].map(x=>[x,x])],filters.module)+select('Owner','owner',[['','All owners'],['missing','Missing owner']],filters.owner)+select('Timing / blocker','timing',[['','All timing'],['overdue','Overdue'],['today','Due today'],['no date','No source date'],['blocked','Blocked / source hold']],filters.timing)+'<label>Find work<input id="find" value="'+E(filters.q)+'"></label></div><div id="tasks">'+(visible.map(task).join('')||'<p>No saved tasks match. Records with no task are not counted as work. Open a source workspace to create a real local task.</p>')+'</div><p class="muted">Cairo today: '+E(state.today)+'. Hospital and committee sources do not have task due dates. No inferred dates or task-level Done flags.</p></section>'}
else if(view==='account'){s='<section class="panel">'+selector()+'</section>';let a=current();if(a){let p=state.plans[company]||{};version=p.version||0;s+='<section class="panel"><h2>'+E(company)+'</h2><p>Explicit research mapping: '+E(a.radar||'Unresolved, shortlist only')+'. No fuzzy name merge.</p><div class="actions">'+Object.entries(a.links).map(([k,v])=>'<a class="badge" href="'+E(v)+'">'+E(k)+' →</a>').join('')+'</div><p class="warn">No confirmed buyer authority, contact permission or commercial outcome is established by this workspace.</p><div class="grid two"><div><h3>What needs checking?</h3><p>'+E(p.next_evidence||'Confirm programme, operations-team capacity and programme-specific CDMO evidence. A listed role alone is not a buyer.')+'</p><p><b>Blocked by:</b> '+E(p.blocker||a.committee?.hold&&'Unresolved source conflict'||'No additional planning blocker recorded; source holds still apply.')+'</p></div><div><h3>Research hand-off</h3><p>'+E(a.committee?.work?.state||'Inspect source review state')+'</p><p>Wording review checks draft wording. Copy review records a decision on exact copy, source and Sample fingerprints. Neither authorizes sending.</p></div></div></section><section class="panel"><h2>Research planning, not qualification</h2><form id="plan"><div class="grid two">'+select('Manual priority','priority',['Not set','High','Normal','Low'].map(x=>[x,x]),p.priority||'Not set')+select('Estimated effort','effort',['Unknown','Short','Medium','Long'].map(x=>[x,x]),p.effort||'Unknown')+'</div><label>Blocked by / dependency<textarea id="blocker">'+E(p.blocker||'')+'</textarea></label><label>Evidence needed next<textarea id="next_evidence">'+E(p.next_evidence||'')+'</textarea></label><label>Planning note<textarea id="note">'+E(p.note||'')+'</textarea></label><details><summary>Source reconciliation workbench, proposal only</summary><p>Compare the preserved saved copy and current generated premise. This never unlocks the source or transfers an old approval.</p><div class="grid two"><div><h3>Preserved saved draft</h3><pre>'+E(a.draft?.saved?JSON.stringify({subject:a.draft.saved.subject,body:a.draft.saved.body,source_hash:a.draft.saved.source_hash},null,2):'No saved source draft')+'</pre></div><div><h3>Current generated premise</h3><pre>'+E(a.draft?JSON.stringify({eligible:a.draft.current.eligible,hold:a.draft.current.hold,subject:a.draft.current.subject,body:a.draft.current.body,source_hash:a.draft.current.source_hash},null,2):'No shortlist draft available')+'</pre></div></div><p>Source fingerprint changed: '+(a.draft?.stale?'Yes, old decision must not be reused':'Not detected, or no saved draft')+'. Separate reads can change between views.</p><label>Proposed replacement subject<input id="proposal_subject" maxlength="3000" value="'+E(p.proposal_subject||'')+'"></label><label>Proposed replacement body<textarea id="proposal_body" maxlength="3000">'+E(p.proposal_body||'')+'</textarea></label><label>Evidence difference / reviewer hand-off<textarea id="reconciliation_note" maxlength="3000">'+E(p.reconciliation_note||'')+'</textarea></label><p class="muted">The proposal is versioned separately with the plan. Applying it to the original source remains OPEN so the preserved databases and source Holds stay intact.</p></details><button class="primary" type="submit">Save local plan</button><span id="planResult" role="status"></span><p class="muted">Stored separately in operations-local.db with version checks and an event log. Does not update scores, evidence or task status.</p></form></section><section class="panel"><h2>Source-owned tasks</h2>'+(a.tasks.map(task).join('')||'<p>No saved source task for this mapped account.</p>')+'</section><section class="panel"><h2>Linked registry evidence</h2>'+(a.hospitals.map(h=>'<p><a href="'+E(h.href)+'">'+E(h.nct)+' · '+E(h.hospital_id)+'</a></p>').join('')||'<p>No exact linked hospital record in the retained mapping.</p>')+'</section>'}}
else if(view==='qualification'){s='<section class="panel"><h2>Evidence before qualification</h2><p class="warn">Research evidence points are not a buying probability. No account is upgraded by a manual planning priority.</p><div class="grid">'+[['Programme','Relevant cell-therapy Phase 1/2 programme, status and geography.','Inspect retained trial and current official programme sources.'],['Team capacity','Actual operations-team scope and workload.','Leadership titles and vacancies alone do not prove a small or stretched team.'],['CDMO','External manufacturing for the specific programme.','A CRO or unrelated partnership is insufficient.'],['Timing','Dated event and a supported link to the operations problem.','A registry update is not buying intent.'],['Buyer','Current remit, authority and procurement process.','Official-page role listing is not buyer verification.'],['Research value','Manual expected value and effort.','Set in Account workspace. No prediction or automatic sales rank.']].map(x=>'<div class="check"><h3>'+x[0]+'</h3><p>'+x[1]+'</p><small>'+x[2]+'</small></div>').join('')+'</div><p>Live verification of a named small account set remains OPEN. No new external research or paid enrichment was performed.</p></section><section class="panel"><h2>Source versions and recovery</h2><p>Baseline modality files and current database evidence have separate fingerprints. A refresh is not a claim that all qualification premises were refreshed.</p><details><summary>Inspect current retained-source manifest</summary><pre>'+E(JSON.stringify(state.manifest,null,2))+'</pre></details><ol><li>Open the account and inspect the changed source, dates and Hold.</li><li>Compare the saved draft premise with current evidence in Message review.</li><li>Keep the old draft and decision history. Never reuse an outdated approval.</li><li>Record a reconciliation proposal below, then resolve the source in its owning workflow. This workspace does not unlock a Hold or rewrite a stale draft.</li></ol><a href="/operations?view=account">Record a planning proposal →</a><p class="muted">Direct stale-draft reconciliation remains deferred: it would modify the preserved source DB. Proposal and version visibility are provided, not a false unlock.</p></section>'}
else if(view==='network'){s='<section class="panel"><h2>From registry evidence to readiness</h2><p class="warn">The retained network is a directory of trial-linked sites, not contracted partners, verified capacity or clinical certification.</p><div class="grid">'+[['Registry link','Exact facility, trial scope and observation date.','Already available in Hospital evidence.'],['Capability','Protocol-specific facilities, handling, staff and quality evidence.','Needs dated evidence and qualified review.'],['Capacity','Available slots, constraints and validity period.','Unknown until confirmed; trial history is not availability.'],['Training','Training scope, record, currency and responsible reviewer.','No training completion inferred.'],['Relationship','Permission to engage, contract status and contact authority.','No partnership inferred from a registry listing.'],['Readiness gate','Evidence for each applicable axis plus exclusions and review date.','Grey remains unknown. Local colour is not certification.']].map(x=>'<article class="check"><h3>'+x[0]+'</h3><p>'+x[1]+'</p><small>'+x[2]+'</small></article>').join('')+'</div><a href="/hospitals">Inspect and assess a specific trial-linked site →</a><p class="muted">Readiness definitions are proposed operational guidance. Real capacity, relationship and qualified clinical review remain OPEN. No new readiness claims were written.</p></section>'}
else if(view==='service'){s=service()}
else if(view==='history'){s='<section class="panel"><h2>Saved review captures</h2><p>Immutable, manual captures of retained data at capture time. A prior-week selection changes the event window, not the age of the current evidence snapshot. No automatic weekly schedule.</p><label>Event week (optional date, Cairo)<input type="date" id="week"></label><button id="capture" class="primary">Capture current retained review</button><p id="captureResult" role="status"></p><div class="grid two">'+select('Baseline capture','before',[['','Choose saved capture'],...state.snapshots.map(s=>[s.id,s.created_at])],'')+select('Comparison capture','after',[['','Choose saved capture'],...state.snapshots.map(s=>[s.id,s.created_at])],'')+'</div><button id="compare">Compare manifests and task counts</button><div id="comparison"></div><div class="scroll"><table><thead><tr><th>Captured at</th><th>Integrity fingerprint</th><th>Saved data</th></tr></thead><tbody>'+state.snapshots.map(s=>'<tr><td>'+E(s.created_at)+'</td><td>'+E(s.digest.slice(0,20))+'</td><td><a href="/api/operations/snapshot?id='+E(s.id)+'" target="_blank" rel="noopener">Open JSON</a></td></tr>').join('')+'</tbody></table></div><p class="muted">No overwrite/delete endpoint. Retention is keep-all locally until the project author chooses a policy. Back up operations-local.db with the source DBs.</p></section>'}
else{s=guide()}
el('#content').innerHTML=(state.demo?'<p class="warn">ISOLATED DEMO. Fictional tasks/plans on retained research. Original databases unchanged.</p>':'')+s;el('#status').textContent='Retained local data · '+state.generated_at+' · no refresh or sending';document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));if(el('#accountSelect'))el('#accountSelect').onchange=e=>go(view,e.target.value);for(const id of ['space','module','owner','timing'])if(el('#'+id))el('#'+id).onchange=e=>{filters[id]=e.target.value;draw()};if(el('#find'))el('#find').oninput=e=>{const start=e.target.selectionStart;filters.q=e.target.value;draw();el('#find').focus();el('#find').setSelectionRange(start,start)};
if(el('#plan'))el('#plan').onsubmit=async e=>{e.preventDefault();const form=e.target,release=window.FormSafety?.begin(form)||(()=>{}),body={key:company,version};for(const k of ['priority','effort','blocker','next_evidence','note','proposal_subject','proposal_body','reconciliation_note'])body[k]=el('#'+k).value;try{const result=await api('/api/operations/plan',body);version=result.version;state.plans[company]={...body,version};window.FormSafety?.saved(form);el('#planResult').textContent=' Saved separately. Source evidence unchanged.'}catch(err){el('#planResult').textContent=err.message}finally{release()}};
if(el('#capture'))el('#capture').onclick=async()=>{const b=el('#capture');b.disabled=true;try{await api('/api/operations/snapshot',{week:el('#week').value});await load();el('#captureResult').textContent='Capture saved with integrity fingerprint.'}catch(e){el('#captureResult').textContent=e.message}finally{b.disabled=false}};
if(el('#compare'))el('#compare').onclick=async()=>{try{const a=await api('/api/operations/snapshot?id='+encodeURIComponent(el('#before').value)),b=await api('/api/operations/snapshot?id='+encodeURIComponent(el('#after').value));const ma=a.payload.work.manifest,mb=b.payload.work.manifest;el('#comparison').innerHTML='<div class="check"><p>Task records: '+a.payload.work.tasks.length+' → '+b.payload.work.tasks.length+'. This is not a conversion or productivity metric.</p><p>Research activity events: '+a.payload.report.research.activity.count+' → '+b.payload.report.research.activity.count+'. Fictional CRM activity events: '+a.payload.report.simulation.activity.count+' → '+b.payload.report.simulation.activity.count+'. These counts are recorded local edits, not real conversations or sales.</p><p>Changed source fingerprints: '+E(Object.keys({...ma,...mb}).filter(k=>ma[k]!==mb[k]).join(', ')||'None')+'</p><p>Compare the downloadable saved JSON for event and evidence detail. Captures reflect separate read transactions, not a single cross-file commit.</p></div>'}catch(e){el('#comparison').textContent=e.message}};
}
async function load(){const token=++requestVersion;state=null;el('#content').innerHTML='';try{const d=await api('/api/operations');if(token!==requestVersion)return;state=d;draw()}catch(e){if(token!==requestVersion)return;el('#status').textContent='Operations unavailable: '+e.message+'. Reload to retry. No stale actions are shown.'}}
function service(){return '<section class="panel"><h2>Service journey</h2><p class="warn">FICTIONAL PORTFOLIO FORMAT. Not a client assessment, medical advice, delivered engagement or evidence of results. Full commercial scope remains OPEN for the project author’s review.</p><div class="grid"><article class="check"><h3>1. Marketing Sample</h3><p>One-page illustration of the format. No diagnosis or company-specific findings.</p><a href="/sample-map">Open current Sample</a></article><article class="check"><h3>2. Operations Review</h3><p>Four-page consultation structure below. Inputs, gaps, actions and acceptance are explicit.</p></article><article class="check"><h3>3. Deeper service</h3><p>Assessment, staff training or site finding only after a scoped decision. An expanded contract is a separate commercial decision.</p></article></div><button onclick="print()">Print four-page review structure</button>'+[
['01 / Context and inputs','Cell Therapy Operations Review','Fictional example: Demo Sponsor and Demo Site. Programme, protocol, geography, owner and review date are placeholders, not evidence.','Required inputs: approved programme/protocol scope; operations hand-off map; site/manufacturing dependencies; source dates and permitted-use limits.','Acceptance: input inventory and exclusions acknowledged. Unknown inputs are listed, not filled with assumptions.'],
['02 / Evidence and operational gaps','Six-axis review','Identity/traceability; logistics and cold chain; site workflow; staff and training; quality/escalation; cross-party ownership. These are review headings, not clinical certification.','For each axis record: observed fact, exact source/date, unresolved gap, likely operational implication labelled as a hypothesis, responsible reviewer. No fictional RAG score is presented as a real assessment.','Acceptance: every finding has a source or an explicit Unknown. A qualified reviewer determines regulated requirements.'],
['03 / Priorities and hand-off plan','What happens next','Example format only: unresolved hand-off ownership → ask the relevant operations owner for the current process and escalation path. This is not an observed customer defect.','For each action: source gap, owner label, dependency, due date agreed by the owner, evidence required to close, and decision reviewer. Do not invent dates or savings.','Acceptance: actions have a named acceptance rule and unresolved dependencies. Completion needs evidence, not a note alone.'],
['04 / Decision and delivery','Close the review, choose the next scope','Deliverables: source inventory, evidence/gap matrix, prioritized action plan and decision log. Handoff: research analyst → operations reviewer → accountable client owner. Role labels are proposed workflow responsibilities, not actual staff.','Next-service gate: deeper assessment for unresolved capability; training for an agreed learning gap; site finding for approved criteria. Expanded contract needs separate scope, responsibilities and agreement.','Acceptance: recipient reviews the package, records accepted/open items, and chooses whether to continue. No automatic sales-stage promotion or claimed client outcome.']].map(x=>'<article class="service-page"><p class="meta">'+x[0]+' · FICTIONAL TEMPLATE</p><h2>'+x[1]+'</h2><p>'+x[2]+'</p><div class="check">'+x[3]+'</div><h3>Delivery acceptance</h3><p>'+x[4]+'</p></article>').join('')+'</section>'}
function guide(){return '<section class="panel"><h2>Start with your role</h2><div class="grid"><article><h3>Research analyst</h3><ol><li>Open an account.</li><li>Inspect the retained evidence gap.</li><li>Record a source task, not a commercial conclusion.</li><li>Label unknowns and hand off.</li></ol></article><article><h3>Review lead</h3><ol><li>Check source currency and Holds.</li><li>Review exact copy and fingerprints.</li><li>Require a new decision when inputs change.</li><li>Do not treat review as send permission.</li></ol></article><article><h3>Department manager</h3><ol><li>Filter the work list by module and timing.</li><li>Distinguish empty records from tasks.</li><li>Inspect blockers and owner labels.</li><li>Capture a dated local review.</li></ol></article></div><h3>Completion rules</h3><p>Research task closure follows its source workflow. Evidence checked is not qualified. A review decision is not a sent message. A simulated win is not revenue. No centralized task Done field has been invented.</p><h3>What stays open</h3><ul><li>Live account verification set and current source checks.</li><li>Commercial service scope, readiness definitions and qualified review.</li><li>Real-user session, not replaced by this expert walkthrough.</li><li>License and redistribution scope for code/source data.</li><li>Any publishing or hosted CI requires a separate decision.</li></ul><details><summary>Local data and security limits</summary><p>Loopback, one operator, no authentication. Planning sidecar is separate from three source databases. No money, external sending or automatic refresh. Back up all DBs consistently using SQLite backup. Do not expose the server to the network.</p></details></section>'}
load();
</script></body></html>
